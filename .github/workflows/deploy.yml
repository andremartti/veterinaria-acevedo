# Publica el sitio en GitHub Pages en cada envío a la rama principal.
#
# El propio flujo activa Pages la primera vez (`enablement: true`), así que no
# hace falta configurarlo a mano. Requisito: el repositorio debe ser público, o
# la cuenta tener plan Pro/Team/Enterprise —GitHub Pages no publica
# repositorios privados en el plan gratuito—.
#
# La ruta base y la dirección pública se toman de la propia configuración de
# Pages, así que este archivo sigue funcionando aunque el repositorio cambie de
# nombre o se le asigne un dominio propio.

name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/veterinaria-acevedo-website-7w9tlf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Activar y leer la configuración de Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Crea el sitio de Pages si todavía no existe.
          enablement: true

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Desplegar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: desplegar
        uses: actions/deploy-pages@v4
