<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3b30" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0f3b30" />

    <!-- Tipografías propias: se precargan para evitar saltos de texto -->
    <link rel="preload" href="/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Título, descripción, Open Graph y datos estructurados se generan a partir
      de `src/data/business.ts` (ver el plugin `seoTags` en `vite.config.ts`),
      para que la información del negocio viva en un solo lugar.
    -->
    <title>%SEO_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
